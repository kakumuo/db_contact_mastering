resources:
  jobs:
    contact_mastering_job: 
      name: contact_mastering_job
      tasks: 
        - task_key: land_new_data
          environment_key: Default
          spark_python_task: 
            python_file: ../src/utils/land_new_data.py

        - task_key: 00_init_catalog
          environment_key: Default
          spark_python_task: 
            python_file: ../src/00_init_catalog.py 
          depends_on: 
            - task_key: land_new_data

        - task_key: 01_init_reference
          environment_key: Default
          spark_python_task: 
            python_file: ../src/01_init_reference.py 
          depends_on: 
            - task_key: 00_init_catalog

        - task_key: 02_ingest_data
          environment_key: Default
          spark_python_task: 
            python_file: ../src/02_ingest_data.py 
          depends_on: 
            - task_key: 01_init_reference

        - task_key: 03_persist_user_profile
          environment_key: Default
          spark_python_task: 
            python_file: ../src/03_persist_user_profile.py 
          depends_on: 
            - task_key: 02_ingest_data

        - task_key: 04_persist_user_deletes
          environment_key: Default
          spark_python_task: 
            python_file: ../src/04_persist_user_deletes.py 
          depends_on:
            - task_key: 03_persist_user_profile

        - task_key: 05_master_address
          environment_key: Default
          spark_python_task: 
            python_file: ../src/05_master_address.py 
          depends_on: 
            - task_key: 04_persist_user_deletes

        - task_key: 06_master_contact
          environment_key: Default
          spark_python_task: 
            python_file: ../src/06_master_contact.py 
          depends_on: 
            - task_key: 05_master_address
            
      parameters: 
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      queue: 
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
            dependencies: 
              - name_generator
              - random_address
              - us_address
            
      performance_target: PERFORMANCE_OPTIMIZED
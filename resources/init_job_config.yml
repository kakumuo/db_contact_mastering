resources:
  jobs:
    init_job:
      name: init_job
      tasks:
        - task_key: init_catalog
          environment_key: Default
          max_retries: 0
          spark_python_task:
            python_file: ../src/init_catalog.py

        - task_key: init_reference
          environment_key: Default
          max_retries: 0
          spark_python_task:
            python_file: ../src/init_reference.py
          depends_on:
            - task_key: init_catalog

        - task_key: land_new_data
          environment_key: Default
          max_retries: 0
          spark_python_task:
            python_file: ../src/land_new_data.py
          depends_on:
            - task_key: init_reference

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
            dependencies:
              - names-generator
              - random-address
              - usaddress

      performance_target: PERFORMANCE_OPTIMIZED
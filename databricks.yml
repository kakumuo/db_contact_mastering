# This is a Declarative Automation Bundle definition for db_contact_mastering.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: db_contact_mastering
  uuid: 3830d0f4-d9a0-4f7e-b500-3ee90babf675

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5ca2fe4b-95de.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-5ca2fe4b-95de.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/foxfen23@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/foxfen23@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: foxfen23@hotmail.com
        level: CAN_MANAGE
